name: cert_check

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_s3_cert:
    runs-on: ubuntu-latest
    steps:
      # See https://docs.stepsecurity.io/harden-runner/getting-started/ for instructions on
      # configuring harden-runner and identifying allowed endpoints.
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            s3.us-east-2.amazonaws.com:443
            sts.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com:443
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      # The cert-proxy-server renews certs with 92% of their lifetime left
      # (certRenewBeforePercentage in deploy/helm/cert-proxy-server/values.yaml),
      # so less than 91% left means renewal has stalled.
      # Certs match combineCertProxyList in deploy/scripts/setup_files/profiles/prod.yaml.
      - name: Check the certs in S3
        run: |
          # The cert buckets are in us-east-2, which might not be AWS_DEFAULT_REGION,
          # and the egress policy blocks the CLI's redirect to another region.
          export AWS_REGION=us-east-2
          failed=0
          for cert in \
            prod.thecombine.app/certs/nuc1-thecombine-app-tls \
            prod.thecombine.app/certs/nuc2-thecombine-app-tls \
            prod.thecombine.app/certs/nuc3-thecombine-app-tls \
            local.thecombine.app/certs/local-thecombine-app-tls; do
            if ! aws s3 cp --no-progress "s3://$cert/cert.pem" cert.pem ||
              ! aws s3 cp --no-progress "s3://$cert/key.pem" key.pem; then
              echo "::error::Could not download $cert from S3."
              failed=1
              continue
            fi
            if [ "$(openssl x509 -pubkey -noout -in cert.pem)" != "$(openssl pkey -pubout -in key.pem)" ]; then
              echo "::error::The $cert key in S3 does not match its cert."
              failed=1
            fi
            echo -n "$cert: "
            openssl x509 -enddate -noout -in cert.pem
            not_before=$(date -d "$(openssl x509 -startdate -noout -in cert.pem | cut -d= -f2)" +%s)
            not_after=$(date -d "$(openssl x509 -enddate -noout -in cert.pem | cut -d= -f2)" +%s)
            if (( (not_after - $(date +%s)) * 100 < (not_after - not_before) * 91 )); then
              echo "::error::The $cert cert in S3 has less than 91% of its lifetime left."
              failed=1
            fi
            rm -f cert.pem key.pem
          done
          exit $failed
        shell: bash
