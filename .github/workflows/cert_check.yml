name: cert_check

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_s3_cert:
    runs-on: ubuntu-latest
    steps:
      # See https://docs.stepsecurity.io/harden-runner/getting-started/ for instructions on
      # configuring harden-runner and identifying allowed endpoints.
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            s3.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com:443
            sts.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com:443
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      # The cert-proxy-server renews certs with 60 days left, so fewer than 50 means renewal has stalled.
      # Certs match combineCertProxyList in deploy/scripts/setup_files/profiles/prod.yaml.
      - name: Check expiration of the certs in S3
        run: |
          failed=0
          for cert in \
            prod.thecombine.app/certs/nuc1-thecombine-app-tls \
            prod.thecombine.app/certs/nuc2-thecombine-app-tls \
            prod.thecombine.app/certs/nuc3-thecombine-app-tls \
            local.thecombine.app/certs/local-thecombine-app-tls; do
            if ! aws s3 cp --no-progress "s3://$cert/cert.pem" cert.pem; then
              echo "::error::Could not download $cert/cert.pem from S3."
              failed=1
              continue
            fi
            echo -n "$cert: "
            openssl x509 -enddate -noout -in cert.pem
            if ! openssl x509 -checkend $((50 * 24 * 60 * 60)) -noout -in cert.pem > /dev/null; then
              echo "::error::The $cert cert in S3 expires within 50 days."
              failed=1
            fi
          done
          exit $failed
        shell: bash
