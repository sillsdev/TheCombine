name: commit-message-lint

on:
  pull_request:
    branches: [master]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  commit-message-lint:
    permissions:
      contents: read
      pull-requests: write
    uses: sillsdev/FieldWorks/.github/workflows/CommitMessage.yml@d0d85cb71e266c2d53b604fd8bb94b4f6ca46975
