name: commit-message-lint

on:
  pull_request:
    branches: [master]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  commit-message-lint:
    permissions:
      contents: read
      pull-requests: write
    uses: sillsdev/FieldWorks/.github/workflows/CommitMessage.yml@41c28113b03aaa1f1b78f07765b654591f2b3d65
