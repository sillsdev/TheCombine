name: commit-message-lint

on:
  pull_request:
    branches: [master]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  commit-message-lint:
    permissions:
      contents: read
      pull-requests: write
    uses: sillsdev/FieldWorks/.github/workflows/CommitMessage.yml@380cc907feeee5fb2f38003fe7675be36646d735
