# Defines the following Kubernetes resources for The Combine:
#  - PersistentVolumeClaim/database-data
#  - Deployment/database
#  - Service/database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  creationTimestamp: null
  name: database-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistentVolumeSize }}
status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    combine-component: database
  name: database
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      combine-component: database
  strategy:
    type: {{ .Values.global.updateStrategy }}
{{- if eq "RollingUpdate" .Values.global.updateStrategy  }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
{{- end }}
  template:
    metadata:
      creationTimestamp: null
      labels:
        combine-component: database
    spec:
      containers:
        - image: {{ include "database.containerImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          name: database
          args:
            - "--replSet"
            - "rs0"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    exec >> /data/db/postStart.log 2>&1
                    set -e
                    echo "[postStart] $(date -Is) starting"
                    echo "[postStart] Waiting for mongod to accept connections"
                    attempts=0
                    until mongosh --quiet --host 127.0.0.1 --eval "db.adminCommand({ ping: 1 }).ok" >/dev/null 2>&1; do
                      attempts=$((attempts + 1))
                      if [ "${attempts}" -ge 120 ]; then
                        echo "[postStart] Failed to connect to mongod after ${attempts} attempts, exiting"
                        exit 1
                      fi
                      sleep 1
                    done
                    echo "[postStart] Ensuring replica set host"
                    mongosh --quiet --host 127.0.0.1 /opt/thecombine/00-replica-set.js || exit $?
                    # mongod can serve the backend from here on, so let the readiness
                    # probe pass while the semantic domain import runs.
                    touch /tmp/replica-set-ready
                    # Only a finished import is recorded, so an interrupted one is redone.
                    import_state="$(mongosh --quiet --host 127.0.0.1 --eval "print(db.getSiblingDB('CombineDatabase').SemanticDomainImportStatus.countDocuments({ _id: 'semantic-domains', completed: true }) === 1 ? 'done' : 'needed');")"
                    if [ "${import_state}" = "needed" ]; then
                      echo "[postStart] Importing semantic domains"
                      /bin/bash /opt/thecombine/update-semantic-domains.sh
                      mongosh --quiet --host 127.0.0.1 --eval "db.getSiblingDB('CombineDatabase').SemanticDomainImportStatus.replaceOne({ _id: 'semantic-domains' }, { _id: 'semantic-domains', completed: true }, { upsert: true });"
                    fi
                    echo "[postStart] $(date -Is) done"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MONGO_INITDB_REPLICA_HOST
              value: "$(POD_IP):27017"
          ports:
            - containerPort: 27017
          readinessProbe:
            # /tmp/replica-set-ready is written by the postStart hook once mongod is
            # a writable primary advertising this pod's IP.  The pod IP is part of
            # the replica set config and changes on every restart, so without this
            # the Service can route the backend to a mongod it cannot use.
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/replica-set-ready
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu:  25m
              memory: 1Gi
{{- if .Values.global.includeResourceLimits }}
            limits:
              memory: 2Gi
{{- end }}
          volumeMounts:
            - mountPath: /data/db
              name: database-data
      restartPolicy: Always
{{- if ne .Values.global.pullSecretName "None" }}
      imagePullSecrets:
         - name: {{ .Values.global.pullSecretName }}
{{- end }}
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: database-data
status: {}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    combine-component: database
  name: database
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: "27017"
      port: 27017
      targetPort: 27017
  selector:
    combine-component: database
status:
  loadBalancer: {}
