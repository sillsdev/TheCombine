---
################################################
# Profile specific configuration items
#
# Profile: desktop
################################################

charts:
  thecombine:
    # Disable AWS Login - only run released images from
    # public.ecr.aws/thecombine
    aws-login:
      enabled: false
    global:
      awsS3Location: local.thecombine.app
      captchaRequired: false
      emailEnabled: false
      offline: true
      imagePullPolicy: IfNotPresent
      pullSecretName: None

    cert-proxy-client:
      enabled: true
      schedule: "*/5 * * * *"
    certManager:
      enabled: false
